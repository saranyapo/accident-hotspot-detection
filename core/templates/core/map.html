<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Road Accident Hotspot Map</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 85vh;
            width: 100%;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Road Accident Hotspot Detection</span>
        <div class="d-flex ms-auto">
            <input type="text" id="searchBox" placeholder="Search a location..." class="form-control me-2" style="width:250px;">
            <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>
    </nav>

    <!-- City Safety Summary -->
<div id="citySummary" class="card m-3" style="display: none;">
    <div class="card-body">

        <h4 id="summaryCity" class="mb-3">
            City Safety Summary
        </h4>

        <div class="row text-center">

            <div class="col">
                <h5 id="summaryHotspots">0</h5>
                <small>Hotspots</small>
            </div>

            <div class="col">
                <h5 id="summaryHigh">0</h5>
                <small>High Risk</small>
            </div>

            <div class="col">
                <h5 id="summaryMedium">0</h5>
                <small>Medium Risk</small>
            </div>

            <div class="col">
                <h5 id="summaryLow">0</h5>
                <small>Low Risk</small>
            </div>

        </div>

    </div>
</div>

<div id="map"></div>

    <button id="resetZoomBtn" style="
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 1000;
    padding: 8px 14px;
    background: white;
    border: 2px solid #333;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
">Reset View</button>

<div id="legend" style="
    position: fixed;
    bottom: 30px;
    left: 20px;
    z-index: 1000;
    background: white;
    padding: 10px 14px;
    border: 2px solid #333;
    border-radius: 6px;
    font-size: 14px;
">
    <b>Risk Level</b><br>
    <span style="color:red;">&#9679;</span> High<br>
    <span style="color:orange;">&#9679;</span> Medium<br>
    <span style="color:green;">&#9679;</span> Low
</div>

<div id="noDataMsg" style="
    display: none;
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: #e0e0e0;
    color: #333;
    padding: 10px 20px;
    border: 2px solid #999;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
">No accident data available for this location</div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    // Center roughly on India
    const map = L.map('map').setView([22.9734, 78.6569], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let hotspotData = []; // store fetched hotspots for distance checks

    // Reset view button
    document.getElementById("resetZoomBtn").addEventListener("click", function() {
        map.setView([22.9734, 78.6569], 5);
        hideNoDataMessage();

        document.getElementById("citySummary").style.display = "none";
    });

    // Location search
    document.getElementById("searchBtn").addEventListener("click", searchLocation);
    document.getElementById("searchBox").addEventListener("keypress", function(e) {
        if (e.key === "Enter") searchLocation();
    });

    function searchLocation() {

        const query = document.getElementById("searchBox").value.trim();

        if (!query) return;

        fetch("/api/geocode/?q=" + encodeURIComponent(query))
            .then(response => response.json())
            .then(data => {

                if (data.error) {
                    alert(data.error);

                    document.getElementById("citySummary").style.display = "none";

                    return;
                }

            // Move map to searched location
                map.setView([data.lat, data.lng], 12);

            // Check whether hotspot data exists nearby
                checkCoverage(data.lat, data.lng);

            // Find hotspots near searched location
                const nearbyClusters = hotspotData.filter(spot =>
                    distanceKm(
                        data.lat,
                        data.lng,
                        spot.lat,
                        spot.lng
                    ) <= 50
                );

                if (nearbyClusters.length === 0) {

                    document.getElementById("citySummary").style.display = "none";

                    return;
                }

            // Show safety summary
                showCitySummary(
                    query,
                    nearbyClusters
                );

        })
        .catch(() => {

            alert("Search failed. Try again.");

            document.getElementById("citySummary").style.display = "none";
        });
    }

    // Haversine distance in km between two lat/lng points
    function distanceKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2) ** 2 +
                  Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                  Math.sin(dLng/2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function checkCoverage(lat, lng) {
        const COVERAGE_RADIUS_KM = 50;
        const nearby = hotspotData.some(spot =>
            distanceKm(lat, lng, spot.lat, spot.lng) <= COVERAGE_RADIUS_KM
        );
        if (nearby) {
            hideNoDataMessage();
        } else {
            showNoDataMessage();
        }
    }

    function showNoDataMessage() {
        document.getElementById("noDataMsg").style.display = "block";
    }

    function hideNoDataMessage() {
        document.getElementById("noDataMsg").style.display = "none";
    }

    function showCitySummary(city, clusters) {

        const summary = document.getElementById("citySummary");

        const high = clusters.filter(
            spot => spot.risk_level === "High"
        ).length;

        const medium = clusters.filter(
            spot => spot.risk_level === "Medium"
        ).length;

        const low = clusters.filter(
            spot => spot.risk_level === "Low"
        ).length;

        document.getElementById("summaryCity").textContent =
            city + " Safety Summary";

        document.getElementById("summaryHotspots").textContent =
            clusters.length;

        document.getElementById("summaryHigh").textContent =
            high;

        document.getElementById("summaryMedium").textContent =
            medium;

        document.getElementById("summaryLow").textContent =
            low;

        summary.style.display = "block";
    }

    // Fetch hotspot clusters and plot them
    fetch("/api/hotspots/")
      .then(response => response.json())
      .then(data => {
        hotspotData = data.hotspots; // save for coverage checks
        data.hotspots.forEach(function(spot) {
          var color = spot.risk_level === "High" ? "red" :
                      spot.risk_level === "Medium" ? "orange" : "green";

          L.circleMarker([spot.lat, spot.lng], {
            radius: 8,
            fillColor: color,
            color: color,
            fillOpacity: 0.7,
            weight: 1
          })
          .bindPopup(
                "<b>" + spot.city + " - Hotspot " + (spot.cluster_id + 1) + "</b><br>" +
                "Approximate Area: " + (spot.area_name || "Unknown Area") + "<br>" +
                "Risk Level: " + spot.risk_level + "<br>" +
                "Avg Risk Score: " + spot.avg_risk_score + "<br>" +
                "Accidents: " + spot.accident_count
            )
          .addTo(map);
        });
      })
      .catch(error => console.error("Error loading hotspots:", error));
</script>

</body>
</html>
